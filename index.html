<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Memory Path</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      min-height: 100vh; background: #111;
      color: #eee; font-family: sans-serif;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
      padding: 20px;
    }
    
    /* Color Themes */
    body.light {
      background: #f5f5f5;
      color: #333;
    }
    body.light .tile {
      background: #ddd;
      color: rgba(0,0,0,0.2);
    }
    
    body.neon {
      background: #0a0a1a;
    }
    body.neon .tile {
      background: #222244;
      box-shadow: 0 0 10px rgba(100,100,255,0.3);
    }
    body.neon .tile.active {
      animation: neonFlash .4s ease-in-out;
    }
    @keyframes neonFlash {
      0% { background: #0ff; box-shadow: 0 0 20px #0ff; }
      50% { background: #00f; box-shadow: 0 0 30px #00f; }
      100% { background: #222244; box-shadow: 0 0 10px rgba(100,100,255,0.3); }
    }
    
    body.pastel {
      background: #ffe6f2;
      color: #663366;
    }
    body.pastel .tile {
      background: #ffccff;
      color: rgba(102,51,102,0.3);
    }
    body.pastel .tile.active {
      animation: pastelFlash .4s ease-in-out;
    }
    @keyframes pastelFlash {
      0% { background: #ff99cc; }
      50% { background: #cc99ff; }
      100% { background: #ffccff; }
    }

    h1 { margin-bottom: 0.2em; text-transform: uppercase; letter-spacing: 2px; font-size: clamp(1.5rem, 4vw, 2.5rem); }
    #score, #highscore { margin-bottom: 0.4em; font-size: clamp(1rem, 3vw, 1.2rem); }
    #reset-btn {
      background: #444; color: #fff; border: none;
      padding: 0.3em 0.8em; border-radius: 5px;
      font-size: 0.9rem; margin-bottom: 1em;
      cursor: pointer; transition: background 0.3s;
    }
    #reset-btn:hover { background: #f55; }

    button {
      margin-top: 1.5em; padding: 0.6em 1.2em;
      font-size: 1rem; border: none; border-radius: 5px;
      background: #0a84ff; color: #fff;
      cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transition: transform .2s, box-shadow .2s, background .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.6); }
    button:active { transform: translateY(0) scale(0.98); background: #006fcc; }

    #grid-container {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1/1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    #grid {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 10px;
      touch-action: manipulation;
      transition: all 0.3s;
    }
    .tile {
      background: #333; border-radius: 10px;
      display: flex; justify-content: center; align-items: center;
      font-size: clamp(1.5rem, 5vw, 2.5rem); 
      color: rgba(255,255,255,0.2);
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      transition: background .3s, transform .1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tile:hover { transform: scale(1.05); }
    .tile:active { transform: scale(0.95); }

    @keyframes flash {
      0% { background: #0f8; }
      50% { background: #080; }
      100% { background: #333; }
    }
    .tile.active { animation: flash .4s ease-in-out; color: rgba(255,255,255,0.8); }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }
    .tile.fail { animation: shake .5s ease-in-out; background: #f44; color: #fee; }

    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: flex;
      justify-content: center; align-items: center;
      flex-direction: column; color: #fff;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }
    #overlay.show { opacity: 1; pointer-events: auto; }
    #overlay h2 { margin-bottom: 0.5em; font-size: clamp(1.5rem, 5vw, 2.5rem); }
    #overlay button { background: #f44; }
    #overlay button:hover { background: #d33; }
    
    /* Countdown overlay */
    #countdown-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: flex;
      justify-content: center; align-items: center;
      flex-direction: column; color: #fff;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }
    #countdown-overlay.show { opacity: 1; pointer-events: auto; }
    #countdown-text {
      font-size: 5rem;
      font-weight: bold;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    
    /* Settings Modal */
    #settings-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.3s;
      background: rgba(0,0,0,0.5);
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
    }
    #settings-btn:hover {
      transform: rotate(30deg);
      background: rgba(0,0,0,0.7);
    }
    
    #settings-modal {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: #222;
      box-shadow: -5px 0 15px rgba(0,0,0,0.5);
      padding: 20px;
      overflow-y: auto;
      transition: right 0.3s;
      z-index: 1000;
    }
    
    #settings-modal.show {
      right: 0;
    }
    
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .settings-header h2 {
      margin: 0;
      font-size: clamp(1.2rem, 4vw, 1.5rem);
    }
    
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 5px;
    }
    
    .setting-group {
      margin-bottom: 20px;
    }
    
    .setting-group h3 {
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
      font-size: clamp(1rem, 3vw, 1.2rem);
    }
    
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
      margin-right: 10px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      transition: .4s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #0a84ff;
    }
    
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    
    .toggle-label {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: clamp(0.9rem, 3vw, 1rem);
    }
    
    select {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      background: #333;
      color: #fff;
      border: none;
      margin-bottom: 10px;
      font-size: clamp(0.9rem, 3vw, 1rem);
    }
    
    /* Toast notification */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1000;
      max-width: 90%;
      text-align: center;
    }
    
    #toast.show {
      opacity: 1;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px; height: 10px;
      opacity: 0.8;
      animation: fall 3s linear forwards;
      will-change: transform, opacity;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* Responsive adjustments */
    @media (max-width: 500px) {
      #grid-container {
        max-width: 100vw;
        height: auto;
      }
      
      .toggle-switch {
        width: 40px;
        height: 20px;
      }
      
      .slider:before {
        height: 14px;
        width: 14px;
      }
      
      input:checked + .slider:before {
        transform: translateX(20px);
      }
    }
  </style>
</head>
<body class="dark">
  <div id="settings-btn">⚙️</div>
  
  <div id="settings-modal">
    <div class="settings-header">
      <h2>Game Settings</h2>
      <button class="close-btn">&times;</button>
    </div>
    
    <div class="setting-group">
      <h3>Gameplay</h3>
      
      <label class="toggle-label">
        <span class="toggle-switch">
          <input type="checkbox" id="random-mode" checked>
          <span class="slider"></span>
        </span>
        Random Pattern Mode
      </label>
      
      <label class="toggle-label">
        <span class="toggle-switch">
          <input type="checkbox" id="zen-mode">
          <span class="slider"></span>
        </span>
        Zen Mode (Infinite Retries)
      </label>
    </div>
    
    <div class="setting-group">
      <h3>Appearance</h3>
      
      <label for="color-theme">Color Theme:</label>
      <select id="color-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="neon">Neon</option>
        <option value="pastel">Pastel</option>
      </select>
    </div>
    
    <div class="setting-group">
      <h3>Difficulty</h3>
      
      <label for="game-mode">Game Mode:</label>
      <select id="game-mode">
        <option value="easy">😊 Easy (3x3)</option>
        <option value="medium">😐 Medium (4x4)</option>
        <option value="hard">😑 Hard (5x5)</option>
        <option value="extreme">💀 Extreme (6x6)</option>
      </select>
      
      <label for="speed">Playback Speed:</label>
      <select id="speed">
        <option value="700">🐢 Slow (700ms)</option>
        <option value="600" selected>🙂 Normal (600ms)</option>
        <option value="400">⚡ Fast (400ms)</option>
        <option value="300">🔥 Ultra Fast (300ms)</option>
      </select>
    </div>
  </div>
  
  <div id="toast">Settings saved!</div>

  <h1>Memory Path</h1>
  <div id="score">Level: 0</div>
  <div id="highscore">High Score: 0</div>
  <button id="reset-btn">🔓 Reset High Score</button>
  
  <div id="grid-container">
    <div id="grid"></div>
  </div>
  
  <button id="start">Start Game</button>

  <div id="overlay">
    <h2>Game Over!</h2>
    <p id="end-text">You reached level 0</p>
    <button id="restart">Restart</button>
  </div>

  <div id="countdown-overlay">
    <div id="countdown-text">3</div>
  </div>

  <script>
    // Game elements
    const gridContainer = document.getElementById('grid-container'),
          grid = document.getElementById('grid'),
          scoreDisplay = document.getElementById('score'),
          highScoreDisplay = document.getElementById('highscore'),
          startBtn = document.getElementById('start'),
          overlay = document.getElementById('overlay'),
          endText = document.getElementById('end-text'),
          restartBtn = document.getElementById('restart'),
          resetBtn = document.getElementById('reset-btn'),
          settingsBtn = document.getElementById('settings-btn'),
          settingsModal = document.getElementById('settings-modal'),
          closeSettingsBtn = document.querySelector('.close-btn'),
          toast = document.getElementById('toast'),
          countdownOverlay = document.getElementById('countdown-overlay'),
          countdownText = document.getElementById('countdown-text');

    // Settings elements
    const randomModeToggle = document.getElementById('random-mode'),
          zenModeToggle = document.getElementById('zen-mode'),
          colorThemeSelect = document.getElementById('color-theme'),
          gameModeSelect = document.getElementById('game-mode'),
          speedSelect = document.getElementById('speed');

    // Game state
    let sequence = [], 
        playerInput = [], 
        level = 0, 
        inPlayback = false,
        gameActive = false,
        zenMode = false,
        gridSize = 3;

    // Initialize game
    function initGame() {
      // Clear existing tiles
      grid.innerHTML = '';
      
      // Create new tiles based on grid size
      const tileCount = gridSize * gridSize;
      grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
      
      for (let i = 0; i < tileCount; i++) {
        const t = document.createElement('div');
        t.classList.add('tile');
        t.dataset.index = i;
        t.addEventListener('click', () => handleTap(i));
        t.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handleTap(i);
        }, { passive: false });
        grid.appendChild(t);
      }
    }

    // Load settings from localStorage
    function loadSettings() {
      const settings = JSON.parse(localStorage.getItem('memory_path_settings')) || {};
      
      if (settings.randomMode !== undefined) randomModeToggle.checked = settings.randomMode;
      if (settings.zenMode !== undefined) zenModeToggle.checked = settings.zenMode;
      if (settings.colorTheme) colorThemeSelect.value = settings.colorTheme;
      if (settings.gameMode) gameModeSelect.value = settings.gameMode;
      if (settings.speed) speedSelect.value = settings.speed;
      
      // Apply loaded settings
      applyTheme(settings.colorTheme || 'dark');
      setGameMode(settings.gameMode || 'easy');
      zenMode = settings.zenMode || false;
    }

    // Save settings to localStorage
    function saveSettings() {
      const settings = {
        randomMode: randomModeToggle.checked,
        zenMode: zenModeToggle.checked,
        colorTheme: colorThemeSelect.value,
        gameMode: gameModeSelect.value,
        speed: speedSelect.value
      };
      
      localStorage.setItem('memory_path_settings', JSON.stringify(settings));
      showToast('Settings saved!');
    }

    // Apply color theme
    function applyTheme(theme) {
      document.body.className = theme;
    }

    // Set game mode (grid size)
    function setGameMode(mode) {
      switch(mode) {
        case 'easy':
          gridSize = 3;
          break;
        case 'medium':
          gridSize = 4;
          break;
        case 'hard':
          gridSize = 5;
          break;
        case 'extreme':
          gridSize = 6;
          break;
        default:
          gridSize = 3;
      }
      initGame();
    }

    // Show toast notification
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Update high score display
    function updateHighScoreUI() {
      const stored = localStorage.getItem('memory_highscore');
      const high = stored ? parseInt(stored) : 0;
      highScoreDisplay.textContent = `High Score: ${high}`;
    }

    // Event listeners for settings changes
    randomModeToggle.addEventListener('change', saveSettings);
    zenModeToggle.addEventListener('change', function() {
      zenMode = this.checked;
      saveSettings();
    });
    
    colorThemeSelect.addEventListener('change', function() {
      applyTheme(this.value);
      saveSettings();
    });
    
    gameModeSelect.addEventListener('change', function() {
      setGameMode(this.value);
      saveSettings();
    });
    
    speedSelect.addEventListener('change', saveSettings);

    // Main event listeners
    settingsBtn.onclick = () => settingsModal.classList.add('show');
    closeSettingsBtn.onclick = () => settingsModal.classList.remove('show');
    
    // Close settings when clicking outside
    document.addEventListener('click', (e) => {
      if (!settingsModal.contains(e.target) && e.target !== settingsBtn) {
        settingsModal.classList.remove('show');
      }
    });

    updateHighScoreUI();

    startBtn.onclick = () => {
      overlay.classList.remove('show');
      startBtn.style.display = 'none';
      startCountdown();
    };

    restartBtn.onclick = () => {
      overlay.classList.remove('show');
      startCountdown();
    };

    resetBtn.onclick = () => {
      localStorage.removeItem('memory_highscore');
      updateHighScoreUI();
      showToast("High score has been reset!");
    };

    function startCountdown() {
      countdownOverlay.classList.add('show');
      let count = 3;
      countdownText.textContent = count;
      
      const countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownText.textContent = count;
        } else {
          countdownText.textContent = "GO!";
          setTimeout(() => {
            clearInterval(countdownInterval);
            countdownOverlay.classList.remove('show');
            startGame();
          }, 500);
        }
      }, 1000);
    }

    function startGame() {
      sequence = [];
      level = 0;
      gameActive = true;
      scoreDisplay.textContent = `Level: ${level}`;
      updateHighScoreUI();
      nextLevel();
    }

    function nextLevel() {
      level++;
      scoreDisplay.textContent = `Level: ${level}`;
      playerInput = [];
      
      if (randomModeToggle.checked) {
        // Full random sequence each level
        sequence = Array.from({ length: level }, () => rand(0, gridSize * gridSize - 1));
      } else {
        // Classic mode - add one new tile to previous sequence
        const newTile = rand(0, gridSize * gridSize - 1);
        sequence.push(newTile);
      }
      
      playback();
    }

    function playback() {
      inPlayback = true;
      const speed = parseInt(speedSelect.value);
      
      sequence.forEach((idx, i) => {
        setTimeout(() => {
          flash(idx);
        }, i * speed);
      });
      
      setTimeout(() => {
        inPlayback = false;
      }, sequence.length * speed);
    }

    function flash(idx) {
      const tiles = [...document.querySelectorAll('.tile')];
      const t = tiles[idx];
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 400);
    }

    function handleTap(idx) {
      if (inPlayback || !gameActive) return;
      
      playerInput.push(idx);
      flash(idx);
      
      if (sequence[playerInput.length - 1] !== idx) {
        const tiles = [...document.querySelectorAll('.tile')];
        tiles[idx].classList.add('fail');
        setTimeout(() => tiles[idx].classList.remove('fail'), 500);
        
        if (zenModeToggle.checked) {
          // Zen mode - just restart the level
          setTimeout(() => {
            playerInput = [];
            playback();
          }, 1000);
        } else {
          gameOver();
        }
        return;
      }
      
      if (playerInput.length === sequence.length) {
        setTimeout(nextLevel, 800);
      }
    }

    function gameOver() {
      gameActive = false;
      
      const stored = localStorage.getItem('memory_highscore');
      const previousHigh = stored ? parseInt(stored) : 0;
      const isNewHigh = level > previousHigh;

      if (isNewHigh) {
        localStorage.setItem('memory_highscore', level);
        updateHighScoreUI();
        overlay.querySelector('h2').textContent = '🎉 New High Score!';
        overlay.querySelector('h2').style.color = '#0f0';
        triggerConfetti();
      } else {
        overlay.querySelector('h2').textContent = 'Game Over!';
        overlay.querySelector('h2').style.color = '#f44';
      }

      endText.textContent = `You reached level ${level}`;
      overlay.classList.add('show');
    }

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Confetti effect
    function triggerConfetti() {
      const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff'];
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = `${Math.random() * 100}vw`;
        confetti.style.top = `-10px`;
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = `${Math.random() * 8 + 4}px`;
        confetti.style.height = confetti.style.width;
        confetti.style.animationDelay = `${Math.random() * 0.5}s`;
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }

    // Initialize the game with settings
    loadSettings();
    initGame();
  </script>
</body>
</html>
